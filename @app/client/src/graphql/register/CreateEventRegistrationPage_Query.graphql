fragment CreateEventRegistrationPage_Query on Query {
  ...SharedLayout_Query
  currentUser {
    id
    registrationProfile {
      ...RegistrationProfile
    }
  }
  eventBySlug(slug: $slug) {
    ...EventPage_Event
  }
  quota(id: $quotaId) {
    ...EventPage_Quota
  }
}

query CreateEventRegistrationPage($slug: String!, $quotaId: UUID!) {
  ...CreateEventRegistrationPage_Query
}
