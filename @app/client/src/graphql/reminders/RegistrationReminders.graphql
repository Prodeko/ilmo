fragment RegistrationReminderFields on EventRegistrationReminder {
  id
  eventId
  deliveryMethod
  minutesBefore
  sentAt
  event {
    id
    slug
    name
    isDraft
    registrationStartTime
  }
}

query RegistrationReminders($first: Int!) {
  telegramBotUsername
  currentReminderPreferences {
    userId
    minutesBefore
    deliveryMethod
  }
  ...SharedLayout_Query
  currentTelegramAccount {
    userId
    username
  }
  eventRegistrationReminders(first: $first, orderBy: PRIMARY_KEY_ASC) {
    totalCount
    nodes {
      ...RegistrationReminderFields
    }
  }
}

query EventRegistrationReminder($eventId: UUID!) {
  currentUser {
    id
    userEmails {
      nodes {
        isPrimary
        isVerified
      }
    }
  }
  telegramBotUsername
  currentReminderPreferences {
    userId
    minutesBefore
    deliveryMethod
  }
  currentTelegramAccount {
    userId
    username
  }
  eventRegistrationReminders(condition: { eventId: $eventId }, first: 1) {
    nodes {
      id
      deliveryMethod
      minutesBefore
      sentAt
    }
  }
}

mutation SetEventRegistrationReminder(
  $eventId: UUID!
  $enabled: Boolean!
  $language: String!
  $minutesBefore: Int = 30
  $deliveryMethod: String = "email"
) {
  setEventRegistrationReminder(
    input: {
      eventId: $eventId
      enabled: $enabled
      language: $language
      minutesBefore: $minutesBefore
      deliveryMethod: $deliveryMethod
    }
  ) {
    boolean
  }
}

mutation RequestTelegramLink {
  requestTelegramLink(input: {}) {
    string
  }
}

mutation DisconnectTelegram {
  disconnectTelegram(input: {}) {
    boolean
  }
}

mutation SaveReminderPreferences(
  $minutesBefore: Int!
  $deliveryMethod: String!
) {
  saveReminderPreferences(
    input: { minutesBefore: $minutesBefore, deliveryMethod: $deliveryMethod }
  ) {
    reminderPreference {
      userId
      minutesBefore
      deliveryMethod
    }
  }
}

mutation EnableEventReminder($eventId: UUID!, $language: String!) {
  enableEventReminder(input: { eventId: $eventId, language: $language }) {
    boolean
  }
}
