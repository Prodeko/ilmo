fragment SharedLayout_Query on Query {
  currentUser {
    ...SharedLayout_User
    __typename
  }
  organizations(orderBy: SLUG_ASC) {
    nodes {
      ...SharedLayout_Organization
      __typename
    }
    __typename
  }
  ssoLoginEnabled
  supportedLanguages
  __typename
}
fragment SharedLayout_User on User {
  id
  name
  username
  avatarUrl
  isAdmin
  isVerified
  primaryEmail
  userEmails(first: 50) {
    nodes {
      ...SharedLayout_UserEmail
      __typename
    }
    __typename
  }
  organizationMemberships(first: 20) {
    totalCount
    nodes {
      id
      isOwner
      organization {
        id
        name
        slug
        __typename
      }
      __typename
    }
    __typename
  }
  __typename
}
fragment SharedLayout_UserEmail on UserEmail {
  id
  email
  isVerified
  isPrimary
  createdAt
  __typename
}
fragment SharedLayout_Organization on Organization {
  id
  name
  slug
  __typename
}
query Shared {
  ...SharedLayout_Query
}