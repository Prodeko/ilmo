fragment SharedLayout_Query on Query {
  currentUser {
    ...SharedLayout_User
    __typename
  }
  organizations(orderBy: SLUG_ASC) {
    nodes {
      ...SharedLayout_Organization
      __typename
    }
    __typename
  }
  paymentsEnabled
  ssoLoginEnabled
  supportedLanguages
  __typename
}
fragment SharedLayout_User on User {
  id
  name
  username
  avatarUrl
  isAdmin
  isVerified
  primaryEmail
  userEmails(first: 50) {
    nodes {
      ...SharedLayout_UserEmail
      __typename
    }
    __typename
  }
  organizationMemberships(first: 20) {
    totalCount
    nodes {
      id
      isOwner
      organization {
        id
        name
        slug
        __typename
      }
      __typename
    }
    __typename
  }
  __typename
}
fragment SharedLayout_UserEmail on UserEmail {
  id
  email
  isVerified
  isPrimary
  createdAt
  __typename
}
fragment SharedLayout_Organization on Organization {
  id
  name
  slug
  __typename
}
fragment PayPage_RegistrationPayment on RegistrationPayment {
  eventId
  eventSlug
  eventName
  eventStartTime
  eventEndTime
  registrationEndTime
  paymentMode
  quotaTitle
  firstName
  lastName
  queueStatus
  queuePosition
  status
  priceCents
  serviceFeeCents
  totalCents
  paidManually
  paidTotalCents
  paidTicketCents
  paidAt
  refundedAmountCents
  refundedAt
  blockedReason
  __typename
}
query PayPage($updateToken: String!) {
  ...SharedLayout_Query
  paymentByUpdateToken(updateToken: $updateToken) {
    ...PayPage_RegistrationPayment
    __typename
  }
}