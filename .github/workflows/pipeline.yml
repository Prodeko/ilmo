name: Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  # Lets docs-only PRs skip e2e. Pushes to main and manual runs always run it.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check for changes outside docs
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: |
            code:
              - "**"
              - "!**/*.md"
              - "!docs/**"

  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  e2e:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  all-checks:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [changes, ci, e2e]
    if: always()
    steps:
      - name: Verify all required jobs succeeded
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CI_RESULT: ${{ needs.ci.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          E2E_SKIPPABLE: ${{ github.event_name == 'pull_request' && needs.changes.outputs.code != 'true' }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES_RESULT ci=$CI_RESULT e2e=$E2E_RESULT e2e_skippable=$E2E_SKIPPABLE"
          if [ "$CHANGES_RESULT" != "success" ] || [ "$CI_RESULT" != "success" ]; then
            exit 1
          fi
          # e2e may only be skipped when the PR touches docs alone
          if [ "$E2E_RESULT" != "success" ] && ! { [ "$E2E_RESULT" = "skipped" ] && [ "$E2E_SKIPPABLE" = "true" ]; }; then
            exit 1
          fi

  deploy:
    name: Deploy
    needs: [all-checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.all-checks.result == 'success'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
