name: E2E

on:
  workflow_call:

jobs:
  cypress:
    name: Cypress (shard ${{ matrix.containers }}/5)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2, 3, 4, 5]
    services:
      redis:
        image: redis:6-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      postgres:
        image: debezium/postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node and pnpm
        uses: ./.github/actions/node-and-cache

      - name: Install pg_dump
        uses: ./.github/actions/install-pg-dump

      - name: Setup environment and database
        run: |
          cp .env.ci .env
          CONFIRM_DROP=1 pnpm run setup

      - name: Build server-side TypeScript
        # Mirror `pnpm dev`'s preamble: build @app/graphql (codegen + tsc) and
        # the rest of the workspace via project-references. Skip `pnpm build`
        # / `next build` deliberately — the server drives Next in dev mode
        # against source files (NODE_ENV != production in installSSR.ts), and
        # leaving production .next/ artifacts around makes Next 16 + Turbopack
        # 500 on the homepage.
        run: |
          pnpm --filter @app/graphql run build
          pnpm tsc

      - name: Start server in background
        run: pnpm --filter @app/server run start &

      - name: Start worker in background
        run: pnpm --filter @app/worker run start &

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          command: pnpm --filter @app/e2e run run:ci
          working-directory: "@app/e2e"
          wait-on: http://localhost:5678
          parallel: true
          install: false
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-${{ matrix.containers }}
          path: "@app/e2e/cypress/screenshots"

      - name: Upload videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-videos-${{ matrix.containers }}
          path: "@app/e2e/cypress/videos"
