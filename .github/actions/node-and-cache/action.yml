name: Setup Node.js and pnpm
description: Sets up Node.js and pnpm with a cached store

inputs:
  node-version:
    description: Node version to use with actions/setup-node
    default: 20.x

runs:
  using: composite
  steps:
    - name: Install pnpm
      # The pnpm version comes from `packageManager` in the root package.json;
      # specifying one here as well makes the action refuse to run.
      uses: pnpm/action-setup@v6
      with:
        run_install: false

    - name: Use Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
